[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetrisk-os"
version = "0.1.0"
description = "Local vehicle-finance research and financial scenario foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "polars>=1.32,<2", "pyarrow>=18,<24", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "lightgbm>=4.5,<5", "joblib>=1.4,<2",
  "matplotlib>=3.9,<4", "mlflow-skinny>=3,<4", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "pre-commit>=4,<5", "pip-audit>=2.7,<3"]

[project.scripts]
fleetrisk = "fleetrisk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetrisk", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/fleetrisk", "apps/api"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

